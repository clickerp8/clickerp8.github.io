<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} · clickERP</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCFDFE;--navy:#12325B;--teal:#0D9488;--amber:#92400E;--amber-bg:#FEF3C7;--code:#0F1E36;--mint:#5EEAD4;--line:#E3E8F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Lato,system-ui,sans-serif;line-height:1.65;font-size:17px}
a{color:var(--teal)}
header{position:sticky;top:0;background:rgba(252,253,254,.95);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:760px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--navy);text-decoration:none}
.logo span{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--navy);color:var(--mint);font-size:15px}
.bar a.home{font-weight:700;font-size:14px;text-decoration:none;color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:30px;line-height:1.2;font-weight:900}
h2{font-size:22px;font-weight:900;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:18px;font-weight:900}
code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:#EEF2F7;padding:1px 5px;border-radius:4px}
pre{background:var(--code);color:#E6EDF6;padding:16px;border-radius:12px;overflow-x:auto}
pre code{background:none;padding:0;color:inherit}
blockquote{margin:16px 0;padding:12px 16px;background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:8px}
blockquote p{margin:4px 0}
img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;display:block;overflow-x:auto;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:#EEF2F7}
.cta{margin-top:40px;background:var(--navy);color:#fff;border-radius:16px;padding:22px;text-align:center}
.cta a{display:inline-block;margin-top:10px;background:var(--teal);color:#fff;font-weight:900;padding:13px 20px;border-radius:12px;text-decoration:none}
.right{display:flex;align-items:center;gap:14px}
.soc{display:flex;gap:10px;align-items:center}.soc a{display:block;width:28px;height:28px}.soc svg{width:28px;height:28px;display:block}
.codewrap{position:relative}
.copy{position:absolute;top:8px;right:8px;background:#1E3354;color:#E6EDF6;border:1px solid #33507A;border-radius:8px;font:700 13px Lato,sans-serif;padding:6px 10px;cursor:pointer}
.copy.done{background:var(--teal);border-color:var(--teal);color:#fff}
pre{padding-top:42px}
footer{text-align:center;font-size:14px;color:#4A5B75;padding:0 18px 32px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="{{ '/' | relative_url }}"><span>cE</span>clickERP</a><div class="right"><a class="home" href="{{ '/' | relative_url }}">← Home</a><div class="soc"><a href="https://www.youtube.com/@clickERP" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#FF0000"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg></a><a href="https://www.linkedin.com/company/clickerp26/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#0A66C2"/><rect x="6" y="10" width="2.6" height="8" fill="#fff"/><circle cx="7.3" cy="6.9" r="1.5" fill="#fff"/><path d="M11 10h2.5v1.2c.5-.8 1.4-1.4 2.7-1.4 2 0 2.8 1.3 2.8 3.4V18h-2.6v-4.3c0-1-.3-1.7-1.3-1.7s-1.5.7-1.5 1.7V18H11z" fill="#fff"/></svg></a><a href="https://www.instagram.com/clickerp_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F58529"/><stop offset=".5" stop-color="#DD2A7B"/><stop offset="1" stop-color="#515BD4"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/><rect x="6" y="6" width="12" height="12" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.4" cy="7.6" r="1" fill="#fff"/></svg></a></div></div></div></header>
<main>
{{ content }}
<div class="cta"><b>Questions, or want live, instructor-led SAP training?</b><br><a href="https://forms.gle/ovT9EgQquL5ERW2c6" target="_blank" rel="noopener">Contact us</a></div>
</main>
<footer><a href="https://www.youtube.com/@clickERP">YouTube</a> · <a href="https://www.linkedin.com/company/clickerp26/">LinkedIn</a> · <a href="https://www.instagram.com/clickerp_/">Instagram</a><br>© 2026 clickERP</footer>
<script>
document.querySelectorAll("pre").forEach(function (pre) {
  var wrap = document.createElement("div");
  wrap.className = "codewrap";
  pre.parentNode.insertBefore(wrap, pre);
  wrap.appendChild(pre);
  var btn = document.createElement("button");
  btn.className = "copy";
  btn.type = "button";
  btn.textContent = "Copy";
  btn.addEventListener("click", function () {
    var text = pre.innerText;
    var done = function () {
      btn.textContent = "Copied!";
      btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1500);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      var t = document.createElement("textarea");
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      t.remove();
      done();
    }
  });
  wrap.appendChild(btn);
});
</script>
</body>
</html>
